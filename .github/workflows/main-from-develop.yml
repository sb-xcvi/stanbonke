# Branch flow: feature/* -> develop -> main.
# Fails any pull request into main that doesn't come from develop.
# Make it binding with a ruleset on main that requires the "only-from-develop" status check.
name: Main only from develop

on:
  pull_request:
    branches: [main]

jobs:
  only-from-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Pull requests into main must come from develop, not '${{ github.head_ref }}'. Merge into develop first."
            exit 1
          fi
          echo "Source branch is develop."
